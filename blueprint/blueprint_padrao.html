:root{
  --bg:#0b0e12;
  --surface:#141a22;
  --surface2:#1a222e;
  --line:#273140;
  --text:#f4f6f8;
  --muted:#9aa7b5;
  --yellow:#ffd700;
  --green:#00ff88;
  --red:#ff5a5a;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0e12;
    --surface:#141a22;
    --surface2:#1a222e;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Archivo", system-ui, -apple-system, Segoe UI, sans-serif;
}

button,input,select,textarea{
  font:inherit;
}

input[type="range"]{
  accent-color:var(--yellow);
}

.mono{
  font-family:"IBM Plex Mono", ui-monospace, monospace;
}

.karaoke-word{
  display:inline-block;
  transition:transform .18s ease, color .18s ease;
}

.karaoke-word.active{
  color:var(--yellow);
  transform:scale(1.18);
  font-weight:800;
}

.karaoke-word.keyword{
  color:var(--yellow);
  font-weight:800;
}

@keyframes pushIn{
  0%{
    transform:translateY(100%);
    opacity:.2;
  }

  60%{
    transform:translateY(-3%);
    opacity:1;
  }

  100%{
    transform:translateY(0);
    opacity:1;
  }
}

.push-anim{
  animation:pushIn .6s cubic-bezier(.16,1,.3,1) both;
}

@keyframes drawLine{
  from{
    stroke-dashoffset:var(--dash);
  }

  to{
    stroke-dashoffset:0;
  }
}

.chart-line{
  stroke-dasharray:var(--dash);
  animation:drawLine var(--dur) ease forwards;
}

@keyframes arrowPop{
  0%{
    transform:translateY(18px) scale(.8);
    opacity:0;
  }

  100%{
    transform:translateY(0) scale(1);
    opacity:1;
  }
}

.arrow-pop{
  animation:arrowPop .45s cubic-bezier(.16,1,.3,1) both;
}

@keyframes pulseDot{
  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.35;
  }
}

.pulse{
  animation:pulseDot 1.2s infinite;
}

input[type="file"]{
  display:none;
}

::-webkit-scrollbar{
  width:10px;
  height:10px;
}

::-webkit-scrollbar-thumb{
  background:#2b3646;
  border-radius:99px;
}

.focus\:border-\[\#FFD700\]:focus{
  --tw-border-opacity: 1;
  border-color: rgb(255 215 0 / var(--tw-border-opacity, 1));
}

.focus\:outline-none:focus{
  outline: 2px solid transparent;
  outline-offset: 2px;
}

@media (min-width: 640px){
  .sm\:inline{
    display: inline;
  }

  .sm\:w-\[280px\]{
    width: 280px;
  }

  .sm\:p-4{
    padding: 1rem;
  }

  .sm\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-\[16px\]{
    font-size: 16px;
  }

  .sm\:text-\[17px\]{
    font-size: 17px;
  }

  .sm\:text-\[20px\]{
    font-size: 20px;
  }
}

@media (min-width: 1024px){
  .lg\:sticky{
    position: sticky;
  }

  .lg\:top-\[76px\]{
    top: 76px;
  }

  .lg\:grid-cols-\[minmax\(0\2c 1fr\)_430px\]{
    grid-template-columns: minmax(0,1fr) 430px;
  }
}
